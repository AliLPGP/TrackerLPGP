<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LPGP">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/lpgp-favicon-32.png">
  <link rel="apple-touch-icon" href="/lpgp-icon-192.png">
  <title>LPGP Tracker – Sign In</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <style>
    .login-tabs { display:flex; gap:0; margin-bottom:24px; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    .login-tab { flex:1; padding:10px; text-align:center; font:600 13px/1 var(--font-sans); color:var(--muted); cursor:pointer; background:transparent; border:none; transition:all .2s; }
    .login-tab.active { background: var(--accent); color:#fff; }
    .login-tab-panel { display:none; }
    .login-tab-panel.active { display:block; }
  </style>
</head>
<body class="login-body">
  <!-- Background: dot field that lights up around the pointer, slow blue
       glows, and a few LPGP marks floating behind the card. -->
  <canvas id="loginBg" aria-hidden="true"></canvas>
  <div class="login-glows" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="login-marks" aria-hidden="true">
    <span style="--x:12%;--y:22%;--s:64px;--d:0s;--depth:28"><img src="logo-mark.png" alt=""></span>
    <span style="--x:82%;--y:16%;--s:44px;--d:-4s;--depth:18"><img src="logo-mark.png" alt=""></span>
    <span style="--x:74%;--y:72%;--s:84px;--d:-8s;--depth:36"><img src="logo-mark.png" alt=""></span>
    <span style="--x:20%;--y:78%;--s:38px;--d:-2s;--depth:14"><img src="logo-mark.png" alt=""></span>
    <span style="--x:48%;--y:8%;--s:30px;--d:-6s;--depth:10"><img src="logo-mark.png" alt=""></span>
    <span style="--x:92%;--y:46%;--s:34px;--d:-10s;--depth:12"><img src="logo-mark.png" alt=""></span>
  </div>
  <button class="login-theme-btn" onclick="loginToggleTheme()" title="Toggle theme" id="loginThemeBtn">🌙</button>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img class="login-logo-img" src="logo-lpgp.png" alt="LPGP">
        <div class="login-logo-text">
          <div class="login-logo-name">Tracker</div>
          <div class="login-logo-sub">Employee Management</div>
        </div>
      </div>

      <div class="login-tabs">
        <button class="login-tab active" onclick="switchTab('admin')">Admin</button>
        <button class="login-tab" onclick="switchTab('staff')">Staff Portal</button>
      </div>

      <div id="loginError" class="alert alert-error hidden"></div>

      <!-- Admin login -->
      <div id="tab-admin" class="login-tab-panel active">
        <form id="adminForm">
          <div class="form-group" style="margin-bottom:14px">
            <label>Username</label>
            <input type="text" id="username" autocomplete="username" placeholder="Enter username" required>
          </div>
          <div class="form-group" style="margin-bottom:20px">
            <label>Password</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="Enter password" required>
          </div>
          <button type="submit" class="login-submit">Sign In →</button>
        </form>
      </div>

      <!-- Staff / Employee login -->
      <div id="tab-staff" class="login-tab-panel">
        <form id="staffForm">
          <div class="form-group" style="margin-bottom:14px">
            <label>Work Email</label>
            <input type="email" id="empEmail" autocomplete="email" placeholder="your@email.com" required>
          </div>
          <div class="form-group" style="margin-bottom:20px">
            <label>PIN</label>
            <input type="password" id="empPin" autocomplete="current-password" placeholder="Your portal PIN" required>
          </div>
          <button type="submit" class="login-submit">Sign In →</button>
        </form>
        <p style="margin-top:12px;font-size:0.78rem;color:var(--muted);text-align:center">PIN is set by your manager in the system.</p>
      </div>

      <p class="login-security-note" style="margin-top:20px">
        Secured with JWT · Session expires after 8–12 hours
      </p>
    </div>
  </div>

  <script>
    // Apply saved theme immediately — dark is the default brand experience
    (function() {
      const saved = localStorage.getItem('emptracker-theme');
      if (saved !== 'light') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      document.addEventListener('DOMContentLoaded', function() {
        const btn = document.getElementById('loginThemeBtn');
        if (btn) btn.textContent = saved !== 'light' ? '☀️' : '🌙';
      });
    })();

    function loginToggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      if (next === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      localStorage.setItem('emptracker-theme', next);
      const btn = document.getElementById('loginThemeBtn');
      if (btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
    }

    function switchTab(tab) {
      document.querySelectorAll('.login-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='admin')||(i===1&&tab==='staff')));
      document.getElementById('tab-admin').classList.toggle('active', tab==='admin');
      document.getElementById('tab-staff').classList.toggle('active', tab==='staff');
      document.getElementById('loginError').classList.add('hidden');
    }

    async function doLogin(url, body, btn) {
      const err = document.getElementById('loginError');
      err.classList.add('hidden');
      btn.textContent = 'Signing in…'; btn.disabled = true;
      const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();
      if (res.ok) { window.location.href = '/'; }
      else { err.textContent = data.error; err.classList.remove('hidden'); btn.textContent = 'Sign In →'; btn.disabled = false; }
    }

    document.getElementById('adminForm').addEventListener('submit', e => {
      e.preventDefault();
      doLogin('/api/login', { username: document.getElementById('username').value, password: document.getElementById('password').value }, e.target.querySelector('button'));
    });

    document.getElementById('staffForm').addEventListener('submit', e => {
      e.preventDefault();
      doLogin('/api/employee-login', { email: document.getElementById('empEmail').value, pin: document.getElementById('empPin').value }, e.target.querySelector('button'));
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
  <script src="login-bg.js" defer></script>
</body>
</html>
